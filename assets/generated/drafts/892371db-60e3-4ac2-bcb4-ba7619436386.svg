<svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
    </style>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dx="8" dy="12" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.15"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="2" dy="3" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.08"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="deskGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fefefe;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f5f5f5;stop-opacity:1"/>
    </linearGradient>
  </defs>
  
  <!-- Background - Desk Surface -->
  <rect width="1080" height="1080" fill="url(#deskGradient)"/>
  
  <!-- Subtle desk texture -->
  <rect x="0" y="0" width="1080" height="1080" fill="#f8fafc" opacity="0.3"/>
  
  <!-- Laptop edge (background, top right corner) -->
  <g opacity="0.6" filter="url(#softShadow)">
    <path d="M 850 80 L 1040 80 L 1040 140 L 860 140 Z" fill="#cbd5e1"/>
    <rect x="860" y="140" width="180" height="8" fill="#94a3b8"/>
    <!-- Keyboard keys suggestion -->
    <rect x="870" y="95" width="22" height="22" rx="2" fill="#e2e8f0"/>
    <rect x="897" y="95" width="22" height="22" rx="2" fill="#e2e8f0"/>
    <rect x="924" y="95" width="22" height="22" rx="2" fill="#e2e8f0"/>
    <rect x="951" y="95" width="22" height="22" rx="2" fill="#e2e8f0"/>
    <rect x="978" y="95" width="22" height="22" rx="2" fill="#e2e8f0"/>
  </g>
  
  <!-- Pen (background, bottom right) -->
  <g opacity="0.7" filter="url(#softShadow)">
    <rect x="880" y="840" width="180" height="8" rx="4" fill="#64748b" transform="rotate(-25 970 844)"/>
    <ellipse cx="885" cy="838" rx="6" ry="4" fill="#475569" transform="rotate(-25 885 838)"/>
  </g>
  
  <!-- CV Page 1 (back page, slightly offset) -->
  <g transform="translate(220, 280) rotate(-2)" filter="url(#shadow)">
    <rect width="280" height="360" fill="white" rx="2"/>
    <!-- Subtle shadow edge -->
    <rect x="278" y="0" width="2" height="360" fill="#e2e8f0"/>
  </g>
  
  <!-- CV Page 2 (front page) -->
  <g transform="translate(240, 260)" filter="url(#shadow)">
    <rect width="280" height="360" fill="white" rx="2"/>
    
    <!-- Header Section with Accent -->
    <rect x="20" y="20" width="50" height="3" fill="#4f46e5"/>
    <rect x="20" y="28" width="240" height="8" rx="1" fill="#e2e8f0"/>
    <rect x="20" y="40" width="180" height="6" rx="1" fill="#f1f5f9"/>
    
    <!-- Section 1 -->
    <rect x="20" y="65" width="80" height="7" rx="1" fill="#0f172a"/>
    <line x1="20" y1="78" x2="260" y2="78" stroke="#4f46e5" stroke-width="1.5"/>
    <rect x="20" y="88" width="240" height="4" rx="1" fill="#e2e8f0"/>
    <rect x="20" y="96" width="220" height="4" rx="1" fill="#e2e8f0"/>
    <rect x="20" y="104" width="235" height="4" rx="1" fill="#e2e8f0"/>
    <rect x="20" y="112" width="200" height="4" rx="1" fill="#e2e8f0"/>
    
    <!-- Section 2 -->
    <rect x="20" y="135" width="90" height="7" rx="1" fill="#0f172a"/>
    <line x1="20" y1="148" x2="260" y2="148" stroke="#4f46e5" stroke-width="1.5"/>
    <rect x="20" y="158" width="240" height="4" rx="1" fill="#e2e8f0"/>
    <rect x="20" y="166" width="210" height="4" rx="1" fill="#e2e8f0"/>
    <rect x="20" y="174" width="230" height="4" rx="1" fill="#e2e8f0"/>
    <rect x="20" y="182" width="190" height="4" rx="1" fill="#e2e8f0"/>
    
    <!-- Section 3 -->
    <rect x="20" y="205" width="70" height="7" rx="1" fill="#0f172a"/>
    <line x1="20" y1="218" x2="260" y2="218" stroke="#4f46e5" stroke-width="1.5"/>
    <rect x="20" y="228" width="235" height="4" rx="1" fill="#e2e8f0"/>
    <rect x="20" y="236" width="215" height="4" rx="1" fill="#e2e8f0"/>
    <rect x="20" y="244" width="240" height="4" rx="1" fill="#e2e8f0"/>
    
    <!-- Section 4 -->
    <rect x="20" y="267" width="65" height="7" rx="1" fill="#0f172a"/>
    <line x1="20" y1="280" x2="260" y2="280" stroke="#4f46e5" stroke-width="1.5"/>
    <rect x="20" y="290" width="230" height="4" rx="1" fill="#e2e8f0"/>
    <rect x="20" y="298" width="225" height="4" rx="1" fill="#e2e8f0"/>
    <rect x="20" y="306" width="205" height="4" rx="1" fill="#e2e8f0"/>
    <rect x="20" y="314" width="240" height="4" rx="1" fill="#e2e8f0"/>
    
    <!-- Bottom subtle elements -->
    <rect x="20" y="335" width="180" height="4" rx="1" fill="#e2e8f0"/>
  </g>
  
  <!-- Overlay text content -->
  <g>
    <!-- Title -->
    <text x="540" y="780" font-family="Inter, sans-serif" font-size="52" font-weight="700" fill="#0f172a" text-anchor="middle">
      CV Writing Tips for
    </text>
    <text x="540" y="845" font-family="Inter, sans-serif" font-size="52" font-weight="700" fill="#0f172a" text-anchor="middle">
      Internationally-Trained Dentists
    </text>
    
    <!-- Subtle accent mark -->
    <rect x="390" y="880" width="300" height="4" rx="2" fill="#4f46e5"/>
  </g>
  
  <!-- Light gradient overlay for depth -->
  <rect x="0" y="0" width="1080" height="1080" fill="url(#lightOverlay)" opacity="0.03" pointer-events="none"/>
  <defs>
    <radialGradient id="lightOverlay">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.1"/>
    </radialGradient>
  </defs>
</svg>
<svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1080" height="1080" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="540" y="180" font-family="Inter, sans-serif" font-size="48" font-weight="700" fill="#0f172a" text-anchor="middle">
    NDEB Exam Application Timeline
  </text>
  
  <!-- Timeline horizontal line -->
  <path d="M 180 540 Q 360 520 540 540 T 900 540" stroke="#4f46e5" stroke-width="4" fill="none" opacity="0.3"/>
  
  <!-- Milestone 1: Document -->
  <circle cx="180" cy="540" r="40" fill="#4f46e5"/>
  <g transform="translate(180, 420)">
    <!-- Document icon -->
    <rect x="-20" y="-25" width="40" height="50" fill="none" stroke="#4f46e5" stroke-width="2.5" stroke-linejoin="round"/>
    <line x1="-12" y1="-15" x2="12" y2="-15" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-12" y1="-5" x2="12" y2="-5" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-12" y1="5" x2="12" y2="5" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-12" y1="15" x2="5" y2="15" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  
  <!-- Milestone 2: Clock -->
  <circle cx="420" cy="540" r="40" fill="#4f46e5"/>
  <g transform="translate(420, 420)">
    <!-- Clock icon -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="#4f46e5" stroke-width="2.5"/>
    <line x1="0" y1="0" x2="0" y2="-15" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="12" y2="8" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  
  <!-- Milestone 3: Calendar -->
  <circle cx="660" cy="540" r="40" fill="#4f46e5"/>
  <g transform="translate(660, 420)">
    <!-- Calendar icon -->
    <rect x="-22" y="-20" width="44" height="48" rx="3" fill="none" stroke="#4f46e5" stroke-width="2.5"/>
    <line x1="-22" y1="-8" x2="22" y2="-8" stroke="#4f46e5" stroke-width="2.5"/>
    <line x1="-14" y1="-28" x2="-14" y2="-16" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="14" y1="-28" x2="14" y2="-16" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-10" cy="4" r="2.5" fill="#4f46e5"/>
    <circle cx="0" cy="4" r="2.5" fill="#4f46e5"/>
    <circle cx="10" cy="4" r="2.5" fill="#4f46e5"/>
    <circle cx="-10" cy="16" r="2.5" fill="#4f46e5"/>
    <circle cx="0" cy="16" r="2.5" fill="#4f46e5"/>
    <circle cx="10" cy="16" r="2.5" fill="#4f46e5"/>
  </g>
  
  <!-- Milestone 4: Checkmark -->
  <circle cx="900" cy="540" r="40" fill="#4f46e5"/>
  <g transform="translate(900, 420)">
    <!-- Checkmark icon -->
    <path d="M -15 0 L -5 12 L 18 -15" fill="none" stroke="#4f46e5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Subtitle -->
  <text x="540" y="780" font-family="Inter, sans-serif" font-size="28" font-weight="400" fill="#0f172a" text-anchor="middle" opacity="0.7">
    Plan ahead for your certification journey
  </text>
</svg>